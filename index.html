<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Premium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root {
        --bg: #05070d;
        --bg-card: #0d1220;
        --bg-card-2: #121a2e;
        --border: #1c2540;
        --text: #e8ecf7;
        --text-dim: #8590ac;
        --primary: #2f6bff;
        --primary-hover: #4d7dff;
        --success: #1fae5c;
        --danger: #e0433f;
        --gold: #f4c542;
        --bg-grad: radial-gradient(circle at 50% 0%, #0b1224 0%, #05070d 60%, #010103 100%);
    }
    html[data-theme="light"] {
        --bg: #f4f6fb;
        --bg-card: #ffffff;
        --bg-card-2: #eef1f8;
        --border: #dde3f0;
        --text: #12172b;
        --text-dim: #626c85;
        --bg-grad: radial-gradient(circle at 50% 0%, #ffffff 0%, #eef1f8 60%, #e4e9f5 100%);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-grad);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        transition: background .2s, color .2s;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 90px; }
    .header { text-align: center; margin-bottom: 22px; }
    .header .crown { font-size: 40px; line-height: 1; margin-bottom: 8px; }
    .header h1 {
        font-size: 22px;
        margin: 0 0 6px;
        background: linear-gradient(90deg, var(--gold), #ffe08a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 700;
    }
    .header p { color: var(--text-dim); font-size: 14px; margin: 0; line-height: 1.4; }

    .section-title { font-size: 13px; color: var(--text-dim); margin: 22px 0 10px; text-transform: uppercase; letter-spacing: .04em; }

    .tariffs { display: flex; flex-direction: column; gap: 10px; }
    .tariff {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: border-color .15s, background .15s;
    }
    .tariff:active { transform: scale(0.99); }
    .tariff .label { font-weight: 600; font-size: 15px; }
    .tariff .price { color: var(--gold); font-weight: 700; font-size: 15px; }

    .trial-card {
        background: linear-gradient(135deg, #1fae5c 0%, #0d7a3e 100%);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        margin-bottom: 14px;
        color: #fff;
    }
    .trial-card .label { font-weight: 700; font-size: 15px; }
    .trial-card .sub { font-size: 12px; opacity: .85; }

    .methods { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .method-btn {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
    }
    .method-btn .method-left { display: flex; align-items: center; gap: 12px; }
    .method-btn .method-icon {
        width: 34px; height: 34px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    .method-btn .method-icon img { width: 22px; height: 22px; object-fit: contain; }
    .method-btn .price { color: var(--text-dim); font-weight: 500; font-size: 13px; }
    .method-btn:active { transform: scale(0.99); }

    .btn {
        display: block;
        width: 100%;
        text-align: center;
        border: none;
        border-radius: 14px;
        padding: 15px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 14px;
        color: #fff;
    }
    .btn-primary { background: var(--primary); }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

    .pay-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-top: 10px; }
    .pay-box .amount { font-size: 26px; font-weight: 800; color: var(--gold); margin-bottom: 4px; }
    .pay-box .desc { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }

    .status { text-align: center; font-size: 13px; color: var(--text-dim); margin-top: 10px; min-height: 18px; }

    .success-screen { text-align: center; padding: 60px 10px; }
    .success-screen .icon { font-size: 56px; margin-bottom: 14px; }
    .success-screen h2 { font-size: 20px; margin: 0 0 8px; color: var(--success); }
    .success-screen p { color: var(--text-dim); font-size: 14px; }

    /* --- Профиль --- */
    .profile-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
    }
    .profile-avatar {
        width: 64px; height: 64px; border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), #8a5cff);
        display: flex; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 700; color: #fff;
        margin: 0 auto 12px;
    }
    .profile-name { font-size: 18px; font-weight: 700; }
    .profile-username { color: var(--text-dim); font-size: 14px; margin-top: 2px; }

    .status-badge {
        display: inline-flex; align-items: center; gap: 6px;
        margin-top: 14px; padding: 8px 14px; border-radius: 999px;
        font-size: 13px; font-weight: 700;
    }
    .status-badge.active { background: rgba(31,174,92,.15); color: var(--success); }
    .status-badge.inactive { background: rgba(224,67,63,.12); color: var(--danger); }

    .manage-card { margin-top: 4px; }
    .manage-box {
        background: linear-gradient(135deg, var(--bg-card-2), var(--bg-card));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        text-align: center;
    }
    .manage-days { font-size: 40px; font-weight: 800; color: var(--gold); line-height: 1; }
    .manage-days-label { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .manage-until { color: var(--text-dim); font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

    .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-slider {
        position: absolute; cursor: pointer; inset: 0;
        background: var(--bg-card-2); border: 1px solid var(--border);
        border-radius: 999px; transition: background .15s;
    }
    .switch-slider::before {
        content: ""; position: absolute; height: 18px; width: 18px;
        left: 3px; top: 50%; transform: translateY(-50%);
        background: #fff; border-radius: 50%; transition: transform .15s;
    }
    .switch input:checked + .switch-slider { background: var(--success); border-color: var(--success); }
    .switch input:checked + .switch-slider::before { transform: translate(20px, -50%); }

    .settings-row {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }
    .settings-row .label { font-size: 14px; font-weight: 600; }
    .toggle-group { display: flex; background: var(--bg-card-2); border-radius: 10px; padding: 3px; gap: 3px; }
    .toggle-group button {
        border: none; background: transparent; color: var(--text-dim);
        padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .toggle-group button.active { background: var(--primary); color: #fff; }

    .bottom-nav {
        position: fixed; left: 0; right: 0; bottom: 0;
        background: var(--bg-card);
        border-top: 1px solid var(--border);
        display: flex;
        padding: 8px 0 max(8px, env(safe-area-inset-bottom));
        max-width: 480px;
        margin: 0 auto;
    }
    .bottom-nav button {
        flex: 1; background: none; border: none; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        color: var(--text-dim); font-size: 11px; font-weight: 600; padding: 6px 0;
    }
    .bottom-nav button .ic { font-size: 20px; }
    .bottom-nav button.active { color: var(--primary); }
    .bottom-nav button .nav-img { display: flex; align-items: center; justify-content: center; }
    .bottom-nav button .nav-img img { width: 22px; height: 22px; object-fit: contain; border-radius: 6px; }

    .promo-input {
        width: 100%;
        background: var(--bg-card-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        font-size: 18px;
        text-align: center;
        letter-spacing: .1em;
        color: var(--text);
        margin-bottom: 10px;
        font-family: inherit;
    }
    .promo-input::placeholder { color: var(--text-dim); letter-spacing: normal; }

    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

    <!-- ===================== СТРАНИЦА: МАГАЗИН ===================== -->
    <div id="page-store">
        <div class="header">
            <div class="crown">👑</div>
            <h1 data-i18n="title"></h1>
            <p data-i18n="desc"></p>
        </div>

        <div id="screen-tariffs">

            <div class="methods" id="methodList"></div>

        </div>

        <div id="screen-pay" class="hidden">
            <div class="pay-box">
                <div class="amount" id="payAmount"></div>
                <div class="desc" id="payDesc"></div>
                <button class="btn btn-primary" id="payBtn" data-i18n="pay"></button>
                <button class="btn btn-success hidden" id="checkBtn" data-i18n="check_payment"></button>
                <div class="status" id="payStatus"></div>
            </div>
            <button class="btn btn-danger" id="backToMethods" data-i18n="back"></button>
        </div>

        <div id="screen-success" class="success-screen hidden">
            <div class="icon">✅</div>
            <h2 data-i18n="success_title"></h2>
            <p data-i18n="success_sub"></p>
        </div>
    </div>

    <!-- ===================== СТРАНИЦА: ПРОФИЛЬ ===================== -->
    <div id="page-profile" class="hidden">
        <div class="header">
            <h1 data-i18n="profile_title"></h1>
        </div>

        <div class="profile-card">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-username" id="profileUsername"></div>
            <div class="status-badge" id="profileStatusBadge"></div>
        </div>

        <!-- Управление подпиской — видно только когда Premium активен -->
        <div id="manageCard" class="manage-card hidden">
            <div class="section-title" data-i18n="manage_title"></div>
            <div class="manage-box">
                <div class="manage-days" id="manageDays">—</div>
                <div class="manage-days-label" id="manageDaysLabel"></div>
                <div class="manage-until" id="manageUntil"></div>
                <button class="btn btn-primary" id="extendBtn" data-i18n="extend"></button>
            </div>
            <div class="settings-row">
                <span class="label" data-i18n="hide_toggle_label"></span>
                <label class="switch">
                    <input type="checkbox" id="hideToggle" />
                    <span class="switch-slider"></span>
                </label>
            </div>
            <div class="status" id="hideToggleStatus"></div>
        </div>

        <div class="section-title" data-i18n="settings"></div>

        <div class="settings-row">
            <span class="label" data-i18n="theme"></span>
            <div class="toggle-group" id="themeToggle">
                <button data-value="dark" data-i18n="theme_dark"></button>
                <button data-value="light" data-i18n="theme_light"></button>
            </div>
        </div>

        <div class="settings-row">
            <span class="label" data-i18n="language"></span>
            <div class="toggle-group" id="langToggle">
                <button data-value="ru">RU</button>
                <button data-value="en">EN</button>
            </div>
        </div>

        <button class="btn btn-primary" id="goBuyBtn" data-i18n="buy_premium"></button>
    </div>

    <!-- ===================== СТРАНИЦА: ПРОМОКОД (активировать) ===================== -->
    <div id="page-promo" class="hidden">
        <div class="header">
            <h1 data-i18n="promo_title"></h1>
            <p data-i18n="promo_desc"></p>
        </div>
        <div class="pay-box">
            <input type="text" id="promoInput" class="promo-input" placeholder="XXXXXXXX" maxlength="16" />
            <button class="btn btn-success" id="promoRedeemBtn" data-i18n="promo_activate"></button>
            <div class="status" id="promoStatus"></div>
        </div>
    </div>

    <!-- ===================== СТРАНИЦА: СОЗДАТЬ ПРОМОКОД (только админ) ===================== -->
    <div id="page-promo-admin" class="hidden">
        <div class="header">
            <h1 data-i18n="promo_admin_title"></h1>
        </div>
        <div class="pay-box">
            <input type="number" id="promoDaysInput" class="promo-input" placeholder="30" />
            <div class="status" data-i18n="promo_days_hint" style="margin-bottom:8px"></div>
            <input type="number" id="promoUsesInput" class="promo-input" placeholder="1" />
            <div class="status" data-i18n="promo_uses_hint" style="margin-bottom:8px"></div>
            <button class="btn btn-primary" id="promoCreateBtn" data-i18n="promo_create"></button>
            <div class="status" id="promoAdminStatus"></div>
        </div>
        <div id="promoResult" class="manage-box hidden" style="margin-top:14px;">
            <div class="manage-days-label" data-i18n="promo_result_label"></div>
            <div class="manage-days" id="promoResultCode" style="font-size:26px;"></div>
        </div>
    </div>

</div>

<div class="bottom-nav">
    <button data-page="store" id="navStore"><span class="ic">🛒</span><span data-i18n="nav_store"></span></button>
    <button data-page="profile" id="navProfile"><span class="ic nav-img"><img src="https://ltdfoto.ru/images/2026/08/17/4519729.png" alt="" /></span><span data-i18n="nav_profile"></span></button>
    <button data-page="promo" id="navPromo"><span class="ic nav-img"><img src="https://ltdfoto.ru/images/2026/08/17/istockphoto-1414997110-612x612.jpg" alt="" /></span><span data-i18n="nav_promo"></span></button>
</div>

if (tg) { tg.ready(); tg.expand(); }

const TARIFF_LABEL_EN = { "1m": "1 month", "3m": "3 months", "6m": "6 months" };

let LANG = localStorage.getItem("miniapp_lang") || "ru";
let THEME = localStorage.getItem("miniapp_theme") || "dark";

function t(key, ...args) {
    const v = I18N[LANG][key];
    return typeof v === "function" ? v(...args) : v;
}

function applyTheme() {
    document.documentElement.setAttribute("data-theme", THEME);
    document.querySelectorAll("#themeToggle button").forEach(b => {
        b.classList.toggle("active", b.dataset.value === THEME);
    });
    localStorage.setItem("miniapp_theme", THEME);
}

function applyLanguage() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll("#langToggle button").forEach(b => {
        b.classList.toggle("active", b.dataset.value === LANG);
    });
    localStorage.setItem("miniapp_lang", LANG);
    renderTariffs();
    if (selectedTariff) renderMethods();
    renderProfile();
}

document.getElementById("themeToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    THEME = btn.dataset.value;
    applyTheme();
});
document.getElementById("langToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    LANG = btn.dataset.value;
    applyLanguage();
});

// ============================================================
// Способы оплаты
// ============================================================
const METHOD_LABELS = {
    stars: {
        name: "Telegram Stars", priceKey: "priceStars", suffix: "",
        color: "#f4c542",
        img: "https://api.wizard-bot.com/docs/assets/star-Cg9w1peQ.png"
    },
    cryptobot: {
        name: "CryptoBot", priceKey: "priceUsdt", suffix: " USDT",
        color: "#3a8ee6",
        img: "https://ltdfoto.ru/images/2026/08/16/Image---2026-08-16T134032.197.png"
    },
    xrocket: {
        name: "xRocket", priceKey: "priceTon", suffix: " TON",
        color: "#0098EA",
        img: "https://ltdfoto.ru/images/2026/08/16/Image---2026-08-16T133820.690.png"
    },
    rollypay: {
        name: "СБП", priceKey: "priceRub", suffix: " ₽",
        color: "#1fae5c",
        img: "https://ltdfoto.ru/images/2026/08/16/Image---2026-08-16T133643.683.png"
    }
};

let tariffs = [];
let selectedTariff = null;
let currentPay = null;
let profileStatus = null; // ответ /api/status

const screens = {
    tariffs: document.getElementById("screen-tariffs"),
    methods: document.getElementById("screen-methods"),
    pay: document.getElementById("screen-pay"),
    success: document.getElementById("screen-success")
};
function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.add("hidden"));
    screens[name].classList.remove("hidden");
}

// ============================================================
// Навигация между страницами (магазин / профиль / промокод)
// ============================================================
const pages = {
    store: document.getElementById("page-store"),
    profile: document.getElementById("page-profile"),
    promo: document.getElementById("page-promo"),
    "promo-admin": document.getElementById("page-promo-admin")
};
function switchPage(name) {
    Object.entries(pages).forEach(([key, el]) => el.classList.toggle("hidden", key !== name));
    document.getElementById("navStore").classList.toggle("active", name === "store");
    document.getElementById("navProfile").classList.toggle("active", name === "profile");
    document.getElementById("navPromo").classList.toggle("active", name === "promo");
    if (name === "profile") loadProfile();
}
document.getElementById("navStore").addEventListener("click", () => switchPage("store"));
document.getElementById("navProfile").addEventListener("click", () => switchPage("profile"));
document.getElementById("navPromo").addEventListener("click", () => switchPage("promo"));
document.getElementById("goBuyBtn").addEventListener("click", () => {
    switchPage("store");
    showScreen("tariffs");
});
document.getElementById("extendBtn").addEventListener("click", () => {
    switchPage("store");
    showScreen("tariffs");
});

// --- Активировать промокод (доступно всем) ---
document.getElementById("promoRedeemBtn").addEventListener("click", async () => {
    const code = document.getElementById("promoInput").value.trim();
    if (!code) return;
    document.getElementById("promoStatus").textContent = t("promo_checking");
    try {
        const res = await fetch("/api/promo/redeem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, code })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
            document.getElementById("promoStatus").textContent = t("promo_success", data.days);
            document.getElementById("promoInput").value = "";
            tg?.HapticFeedback?.notificationOccurred?.("success");
            loadProfile();
        } else {
            const map = { not_found: "promo_not_found", already_used: "promo_already_used", exhausted: "promo_exhausted" };
            document.getElementById("promoStatus").textContent = t(map[data.error] || "promo_error");
        }
    } catch (err) {
        document.getElementById("promoStatus").textContent = t("promo_error");
    }
});

// --- Создать промокод (только админ, экран открывается по ссылке из бота) ---
document.getElementById("promoCreateBtn").addEventListener("click", async () => {
    const days = Number(document.getElementById("promoDaysInput").value);
    const maxUses = Number(document.getElementById("promoUsesInput").value) || 1;
    if (!days || days <= 0) return;
    document.getElementById("promoAdminStatus").textContent = t("promo_checking");
    try {
        const res = await fetch("/api/promo/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, days, maxUses })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
            document.getElementById("promoAdminStatus").textContent = "";
            document.getElementById("promoResult").classList.remove("hidden");
            document.getElementById("promoResultCode").textContent = data.code;
        } else {
            document.getElementById("promoAdminStatus").textContent = t("promo_create_error");
        }
    } catch (err) {
        document.getElementById("promoAdminStatus").textContent = t("promo_create_error");
    }
});

async function loadTariffs() {
    const res = await fetch("/api/tariffs");
    const data = await res.json();
    tariffs = data.tariffs || [];
    renderTariffs();
}

function tariffLabel(t) {
    return LANG === "en" ? (TARIFF_LABEL_EN[t.id] || t.label) : t.label;
}

function renderTariffs() {
    const list = document.getElementById("tariffList");
    list.innerHTML = "";
    tariffs.forEach(tf => {
        const el = document.createElement("div");
        el.className = "tariff";
        el.innerHTML = `<span class="label">${tariffLabel(tf)}</span><span class="price">${LANG === "en" ? "from" : "от"} ${tf.priceRub} ₽</span>`;
        el.addEventListener("click", () => selectTariff(tf));
        list.appendChild(el);
    });
}

function selectTariff(tf) {
    selectedTariff = tf;
    renderMethods();
    showScreen("methods");
}

function renderMethods() {
    const list = document.getElementById("methodList");
    list.innerHTML = "";
    Object.entries(METHOD_LABELS).forEach(([key, m]) => {
        const price = selectedTariff[m.priceKey];
        const el = document.createElement("div");
        el.className = "method-btn";
        el.innerHTML = `
            <span class="method-left">
                <span class="method-icon" style="background:${m.color}"><img src="${m.img}" alt="${m.name}" /></span>
                <span>${m.name}</span>
            </span>
            <span class="price">${price}${m.suffix}</span>`;
        el.addEventListener("click", () => startPay(key));
        list.appendChild(el);
    });
}

function openPaymentLink(url) {
    if (url.startsWith("https://t.me/") && tg?.openTelegramLink) {
        tg.openTelegramLink(url);
    } else if (tg?.openLink) {
        tg.openLink(url);
    } else {
        window.open(url, "_blank");
    }
}

document.getElementById("backToTariffs").addEventListener("click", () => showScreen("tariffs"));
document.getElementById("backToMethods").addEventListener("click", () => showScreen("methods"));

async function startPay(method) {
    const m = METHOD_LABELS[method];
    document.getElementById("payAmount").textContent = `${selectedTariff[m.priceKey]}${m.suffix}`;
    document.getElementById("payDesc").textContent = `${m.name} · ${tariffLabel(selectedTariff)}`;
    document.getElementById("payStatus").textContent = "";
    document.getElementById("checkBtn").classList.add("hidden");
    document.getElementById("payBtn").classList.remove("hidden");
    showScreen("pay");

    document.getElementById("payStatus").textContent = t("creating_invoice");
    try {
        const res = await fetch("/api/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ method, tariffId: selectedTariff.id, initData })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error || "Error");

        currentPay = { method, checkId: data.checkId };

        if (method === "stars" && tg?.openInvoice) {
            document.getElementById("payBtn").classList.add("hidden");
            document.getElementById("payStatus").textContent = t("opening_payment");
            tg.openInvoice(data.url, (status) => {
                if (status === "paid") {
                    showSuccess();
                } else if (status === "failed") {
                    document.getElementById("payStatus").textContent = t("payment_failed");
                } else if (status === "cancelled") {
                    document.getElementById("payStatus").textContent = t("payment_cancelled");
                } else {
                    document.getElementById("payStatus").textContent = "";
                }
            });
            return;
        }

        document.getElementById("payStatus").textContent = "";
        const payBtn = document.getElementById("payBtn");
        payBtn.onclick = () => openPaymentLink(data.url);
        document.getElementById("checkBtn").classList.remove("hidden");
    } catch (err) {
        document.getElementById("payStatus").textContent = "⚠️ " + err.message;
    }
}

document.getElementById("checkBtn").addEventListener("click", async () => {
    if (!currentPay) return;
    document.getElementById("payStatus").textContent = t("checking");
    try {
        const res = await fetch("/api/check", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ method: currentPay.method, checkId: currentPay.checkId, tariffId: selectedTariff.id, initData })
        });
        const data = await res.json();
        if (data.paid) {
            showSuccess();
        } else {
            document.getElementById("payStatus").textContent = t("not_paid_yet");
        }
    } catch (err) {
        document.getElementById("payStatus").textContent = t("check_error");
    }
});

function showSuccess() {
    showScreen("success");
    tg?.HapticFeedback?.notificationOccurred?.("success");
    loadProfile();
}

// ============================================================
// Триал (3 дня бесплатно)
// ============================================================
document.getElementById("trialCard").addEventListener("click", async () => {
    try {
        const res = await fetch("/api/trial", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
            showScreen("success");
            tg?.HapticFeedback?.notificationOccurred?.("success");
            loadProfile();
        }
    } catch (e) {}
});

document.getElementById("hideToggle").addEventListener("change", async (e) => {
    const enabled = e.target.checked;
    document.getElementById("hideToggleStatus").textContent = "...";
    try {
        const res = await fetch("/api/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, enabled })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "error");
        document.getElementById("hideToggleStatus").textContent = enabled ? t("hide_on") : t("hide_off");
        if (profileStatus?.premium) profileStatus.premium.enabled = enabled;
    } catch (err) {
        e.target.checked = !enabled;
        document.getElementById("hideToggleStatus").textContent = t("toggle_error");
    }
});

// ============================================================
// Профиль
// ============================================================
function renderProfile() {
    if (!tgUser && !profileStatus) return;
    const first = (profileStatus?.user?.first_name) || tgUser?.first_name || "";
    const last = (profileStatus?.user?.last_name) || tgUser?.last_name || "";
    const username = (profileStatus?.user?.username) || tgUser?.username || null;

    document.getElementById("profileName").textContent = `${first} ${last}`.trim() || "—";
    document.getElementById("profileUsername").textContent = username ? "@" + username : "";
    document.getElementById("profileAvatar").textContent = (first[0] || "?").toUpperCase();

    const badge = document.getElementById("profileStatusBadge");
    const manageCard = document.getElementById("manageCard");
    const until = profileStatus?.premium?.until;
    const untilDate = until ? new Date(until) : null;
    const hasSubscription = untilDate && untilDate.getTime() > Date.now();

    if (hasSubscription) {
        const untilStr = untilDate.toLocaleDateString(LANG === "en" ? "en-US" : "ru-RU");
        badge.className = "status-badge active";
        badge.textContent = `👑 ${t("premium_active")} ${t("until")} ${untilStr}`;

        manageCard.classList.remove("hidden");
        const daysLeft = Math.max(0, Math.ceil((untilDate - Date.now()) / (24 * 60 * 60 * 1000)));
        document.getElementById("manageDays").textContent = daysLeft;
        document.getElementById("manageDaysLabel").textContent = t("days_left");
        document.getElementById("manageUntil").textContent = `${t("expires_on")}: ${untilStr}`;

        const enabled = !!profileStatus.premium.enabled;
        document.getElementById("hideToggle").checked = enabled;
        document.getElementById("hideToggleStatus").textContent = enabled ? t("hide_on") : t("hide_off");
    } else {
        badge.className = "status-badge inactive";
        badge.textContent = t("premium_inactive");
        manageCard.classList.add("hidden");
    }

    const trialCard = document.getElementById("trialCard");
    if (profileStatus?.trialAvailable) {
        trialCard.classList.remove("hidden");
        document.getElementById("trialLabel").textContent = t("trial_days", 3);
    } else {
        trialCard.classList.add("hidden");
    }
}

async function loadProfile() {
    try {
        const res = await fetch("/api/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData })
        });
        const data = await res.json();
        if (res.ok) {
            profileStatus = data;
            renderProfile();
        }
    } catch (e) {}
}

// ============================================================
// Старт
// ============================================================
applyTheme();
applyLanguage();
loadTariffs();
loadProfile();

// Если открыли по ссылке ?screen=profile (из уведомления бота) — сразу профиль.
// ?screen=promo-admin (из кнопки "Создать промокод" в /admin) — экран создания,
// но только если человек реально админ (проверяем через /api/status).
const requestedScreen = new URLSearchParams(window.location.search).get("screen");
if (requestedScreen === "profile") {
    switchPage("profile");
} else if (requestedScreen === "promo-admin") {
    fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData })
    })
        .then(r => r.json())
        .then(data => {
            if (data.isAdmin) switchPage("promo-admin");
            else switchPage("store");
        })
        .catch(() => switchPage("store"));
} else {
    switchPage("store");
}
</script>
</body>
</html>
